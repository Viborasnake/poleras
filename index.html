    <style>
      body.is-preloading{margin:0;overflow:hidden;background:#000}
      .site-preloader{--sk-surface:#17171a;--sk-surface-raised:#24242a;--sk-surface-muted:#303038;--sk-highlight:rgba(255,255,255,.09);position:fixed;inset:0;z-index:9999;overflow:hidden;background:#000;color:#fff;transition:opacity .32s ease,visibility .32s ease}

      .sk-line,.sk-block,.sk-pill,.sk-card{position:relative;overflow:hidden;background:var(--sk-surface-raised)}
      .sk-line::after,.sk-block::after,.sk-pill::after,.sk-card::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--sk-highlight),transparent);animation:sk-shimmer 1.6s ease-in-out infinite}

      .sk-nav{height:100px;display:flex;align-items:center;gap:22px}

      .sk-nav-links .sk-line{width:92px;height:11px;border-radius:999px}
      .sk-pill{width:166px;height:46px;margin-left:15px;border-radius:999px;background:var(--sk-surface-muted)}
      .sk-hero{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;padding-top:34px}
      .sk-copy{padding-top:14px}
      .sk-copy>.sk-line:first-child{width:210px;height:10px;margin-bottom:30px;border-radius:999px}
      .sk-title{display:grid;gap:13px;margin-bottom:30px}
      .sk-title .sk-line{height:72px;border-radius:12px;background:var(--sk-surface-muted)}
      .sk-title .sk-line:nth-child(1){width:86%}.sk-title .sk-line:nth-child(2){width:94%}.sk-title .sk-line:nth-child(3){width:62%;background:color-mix(in srgb,#f957a4 44%,#17171a)}
      .sk-copy-lines{display:grid;gap:10px;margin-bottom:30px}.sk-copy-lines .sk-line{width:78%;height:13px;border-radius:999px}.sk-copy-lines .sk-line:last-child{width:58%}
      .sk-copy>.sk-pill{width:210px;height:54px;margin:0;background:color-mix(in srgb,#f957a4 44%,#17171a)}
      .sk-art{height:545px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:radial-gradient(circle at 78% 28%,rgba(249,87,164,.18),transparent 34%),radial-gradient(circle at 28% 78%,rgba(102,82,197,.16),transparent 38%),linear-gradient(135deg,#151519,#0d0d10);position:relative;overflow:hidden}
      .sk-shirt{position:absolute;left:23%;top:15%;width:54%;height:66%;border:1px solid rgba(255,255,255,.1);border-radius:46% 46% 20% 20%;background:linear-gradient(135deg,#45454d,#29292f);transform:rotate(-6deg)}
      .sk-art .sk-line{position:absolute;left:28px;top:28px;width:126px;height:9px;border-radius:999px;background:#dfff78}
      .sk-lower{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}.sk-card{height:118px;border:1px solid rgba(255,255,255,.06);border-radius:14px;background:var(--sk-surface)}
      .sk-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      html.preload-light body.is-preloading{background:#f9f7f2}html.preload-light .site-preloader{--sk-surface:#eeeae3;--sk-surface-raised:#e8e5de;--sk-surface-muted:#d9d6cf;background:#f9f7f2;color:#262920}html.preload-light .sk-line,html.preload-light .sk-block,html.preload-light .sk-pill,html.preload-light .sk-card{background:#e8e5de}html.preload-light .sk-line::after,html.preload-light .sk-block::after,html.preload-light .sk-pill::after,html.preload-light .sk-card::after{background:linear-gradient(90deg,transparent,#ffffffa8,transparent)}html.preload-light .sk-brand,html.preload-light .sk-title .sk-line{background:#dedbd4}html.preload-light .sk-title .sk-line:nth-child(3){background:#efb4cf}html.preload-light .sk-pill,html.preload-light .sk-copy>.sk-pill{background:#d9d6cf}html.preload-light .sk-art{background:#cfc5e8}html.preload-light .sk-shirt{background:#f2f0ea}html.preload-light .sk-art .sk-line{background:#b5a8d2}html.preload-light .sk-card{background:#eeeae3}

      .sk-drop-card:nth-child(5){grid-column:1/span 3;grid-row:3/span 2}.sk-drop-card:nth-child(6){grid-column:4/span 9;grid-row:3/span 2}
      .sk-drop-card .sk-pill{position:absolute;left:16px;top:16px;width:92px;height:28px;margin:0}
      .sk-drop-card-footer{position:absolute;inset:auto 16px 20px;display:grid;gap:12px}.sk-drop-card-footer .sk-line{height:22px;width:68%;border-radius:6px}.sk-drop-card-footer .sk-line:last-child{height:12px;width:48%}
      .sk-drop-card:first-child .sk-drop-card-footer{inset:auto 0 0;padding:22px;background:var(--sk-surface-muted)}
      @media(max-width:1000px){.sk-drop-intro{grid-template-columns:1fr;padding-top:24px;gap:24px}.sk-drop-search{width:100%}.sk-drop-wall{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:auto;gap:18px}.sk-drop-wall .sk-drop-card:nth-child(n){grid-column:auto;grid-row:auto;min-height:430px}.sk-drop-wall .sk-drop-card:first-child{min-height:580px}.sk-drop-filters{flex-wrap:wrap}.sk-drop-filters .sk-pill:first-child{margin-right:100%;height:44px}.sk-drop-title .sk-line{max-width:600px}.sk-drop .sk-nav-links{display:flex}}
      @media(max-width:640px){.sk-drop.sk-shell{width:90%}.sk-drop .sk-nav{height:68px}.sk-drop .sk-brand{width:145px;height:30px}.sk-drop-intro{padding:24px 0 20px}.sk-drop-title .sk-line{height:clamp(32px,8.7vw,48px)}.sk-drop-copy>.sk-line{width:180px;margin-bottom:16px}.sk-drop-copy>.sk-drop-subtitle{height:14px;width:95%;margin:20px 0 0}.sk-drop-search .sk-pill{height:60px}.sk-drop-filters{display:grid;grid-template-columns:repeat(6,82px);gap:8px;padding:12px 0}.sk-drop-filters .sk-pill:first-child{grid-column:1/-1;width:230px;margin:0}.sk-drop-wall{grid-template-columns:1fr;grid-auto-rows:auto;gap:17px}.sk-drop-wall .sk-drop-card:nth-child(n){grid-row:auto;min-height:0;aspect-ratio:4/5}.sk-drop-wall .sk-drop-card:first-child{min-height:0;aspect-ratio:1/1}.sk-drop-wall .sk-drop-card:last-child{display:none}}
      @media(prefers-reduced-motion:reduce){.sk-line::after,.sk-block::after,.sk-pill::after,.sk-card::after{animation:none}.site-preloader{transition:none}}
