<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title>Confirma tu correo</title>
  </head>
  <body style="margin:0;padding:0;background-color:#0f1219;color:#c5cbd6;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f1219" style="width:100%;margin:0;padding:28px 14px;background-color:#0f1219">
      <tr>
        <td align="center" style="padding:0">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" bgcolor="#171b24" style="width:100%;max-width:560px;background-color:#171b24;border:2px solid #2c3344;border-radius:16px">
            <tr>
              <td style="padding:16px 20px 14px;border-bottom:2px solid #2c3344">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="40" height="40" align="center" valign="middle" bgcolor="#f957a4" style="width:40px;height:40px;background-color:#f957a4;border:2px solid #2c3344;border-radius:10px;color:#171b24;font-size:22px;line-height:40px;font-weight:700">D</td>
                    <td style="padding-left:10px;color:#c5cbd6;font-size:18px;line-height:22px;font-weight:700">Droska</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td height="4" bgcolor="#f957a4" style="height:4px;line-height:4px;font-size:0;background-color:#f957a4">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:26px 32px 12px">
                <p style="margin:0 0 10px;color:#f957a4;font-size:11px;line-height:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase">TU ESPACIO</p>
                <h1 style="margin:0;color:#c5cbd6;font-size:30px;line-height:35px;font-weight:700">Confirma tu correo.</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 26px">
                <p style="margin:0;color:#8b93a7;font-size:16px;line-height:25px">
                  Haz clic en el botón para activar tu cuenta Droska y terminar tu registro.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#dce3f0" style="background-color:#dce3f0;border:2px solid #2c3344;border-radius:10px;border-bottom:4px solid #f5c518">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;color:#0f1219;font-size:15px;line-height:18px;font-weight:700;text-decoration:none">Confirmar mi correo</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 36px">
                <p style="margin:0;color:#6a7285;font-size:13px;line-height:20px">
                  Si no creaste esta cuenta, puedes ignorar este correo. El enlace es personal y caduca por seguridad.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:18px 0 0;color:#6a7285;font-size:12px;line-height:18px;text-align:center">Droska · Poleras que hablan por ti.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
