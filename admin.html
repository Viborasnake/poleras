<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel de administración de Droska" />
    <title>Droska — Administración</title>
  </head>
  <body>
    <main id="admin-app">
      <section class="admin-loading" role="status" aria-live="polite">

          <p>Estamos cargando pedidos, catálogo y herramientas.</p>

        </div>
      </section>
    </main>
    <script type="module" src="/src/admin.js"></script>
