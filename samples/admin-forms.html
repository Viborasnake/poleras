<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Droska · Evaluación de formularios administrativos</title><link rel="stylesheet" href="/src/design-system.css"><link rel="stylesheet" href="/src/admin.css"><style>body{max-width:850px;margin:24px auto;padding:0 18px}header{margin-bottom:24px}#fixture.admin-dialog{width:100%;max-height:none;overflow:visible;box-shadow:none}#fixture>form{display:grid;gap:18px;padding:25px;border:1px solid var(--ds-border-control);border-radius:18px;background:var(--ds-surface-raised)}#fixture form>label{display:grid}#fixture .dialog-close,#fixture .dialog-cancel{display:none}#results{padding:16px;white-space:pre-wrap;font:14px/1.5 var(--ds-font-body)}#controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}#outcome{font-weight:700}#fixture [hidden]{display:none!important}input,textarea,select{max-width:100%}</style></head><body><header><p>LABORATORIO LOCAL · CATÁLOGO FICTICIO · SIN PUBLICACIONES</p><h1>Administración paso a paso</h1><p>HTML extraído de los formularios reales. Las acciones finales se simulan sin iniciar sesión ni consultar servicios.</p></header><div id="controls"><label>Formulario <select id="scenario"><option value="product">Producto</option><option value="collection">Colección</option><option value="design">Diseño</option></select></label><label>Modo <select id="mode"><option value="create">Crear</option><option value="edit">Editar existente</option></select></label><button class="admin-secondary" type="button" id="run">Ejecutar evaluación local</button><button class="admin-secondary" type="button" id="reset">Reiniciar</button></div><pre id="results" role="status">Evaluación pendiente.</pre><div id="fixture"></div><p id="outcome" role="status"></p><script type="module" src="./admin-forms.js"></script></body></html>
